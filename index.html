<style>
  /* ---------- Tokens ---------- */
  :root{
    --ink: #0B1712;
    --ink-2: #122019;
    --ink-3: #17291F;
    --line: rgba(180,146,79,0.22);
    --silver: #C7D3C9;
    --silver-dim: #91A69A;
    --parchment: #EDE6D3;
    --gold: #B4924F;
    --gold-bright: #E3C989;
    --font-display: 'Cinzel', 'Trajan Pro', serif;
    --font-body: 'Cormorant Garamond', 'Iowan Old Style', serif;
    --maxw: 1120px;
  }

  /* ---------- Reset ---------- */
  *,*::before,*::after{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; scroll-padding-top: 96px; }
  body{ margin:0; }
  h1,h2,h3,p,ul,figure{ margin:0; }
  ul{ list-style:none; padding:0; }
  img,svg{ display:block; max-width:100%; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; background:none; border:none; color:inherit; cursor:pointer; }
  ::selection{ background: var(--gold); color: var(--ink); }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- Base ---------- */
  body{
    background-color: var(--ink);
    background-image:
      radial-gradient(1px 1px at 18px 28px, rgba(237,230,211,.32), transparent),
      radial-gradient(1px 1px at 118px 78px, rgba(237,230,211,.22), transparent),
      radial-gradient(1.5px 1.5px at 198px 148px, rgba(237,230,211,.28), transparent),
      radial-gradient(1px 1px at 58px 188px, rgba(237,230,211,.18), transparent),
      radial-gradient(1px 1px at 318px 58px, rgba(237,230,211,.26), transparent),
      radial-gradient(1.5px 1.5px at 258px 238px, rgba(237,230,211,.2), transparent),
      radial-gradient(1px 1px at 358px 318px, rgba(237,230,211,.28), transparent),
      radial-gradient(1px 1px at 8px 338px, rgba(237,230,211,.16), transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
    background-attachment: fixed;
    color: var(--silver);
    font-family: var(--font-body);
    font-size: 1.15rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3{ font-family: var(--font-display); color: var(--parchment); font-weight: 600; letter-spacing: 0.03em; }
  h2{ font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.5rem); }
  h3{ font-size: clamp(1.2rem, 1.05rem + 0.6vw, 1.5rem); font-weight: 500; }

  a:focus-visible, button:focus-visible{ outline: 2px solid var(--gold-bright); outline-offset: 4px; }

  .skip-link{
    position:absolute; left:1rem; top:-3rem; z-index:200;
    background: var(--ink-3); color: var(--parchment); padding:.6rem 1rem;
    border:1px solid var(--gold); transition: top .2s ease;
  }
  .skip-link:focus{ top:1rem; }

  .wrap{ max-width: var(--maxw); margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 3rem); }

  /* ---------- Hidden defs ---------- */
  .defs{ position:absolute; width:0; height:0; overflow:hidden; }

  .divider-svg{ width: min(360px, 70%); height: 40px; margin: 0 auto; color: var(--gold); opacity: .55; }
  .icon{ width: 34px; height: 34px; color: var(--gold); }

  /* ---------- Nav ---------- */
  .nav{
    position: fixed; inset: 0 0 auto 0; z-index: 100;
    display:flex; align-items:center; justify-content:space-between;
    padding: 1.1rem clamp(1.25rem, 4vw, 3rem);
    background: rgba(11,23,18,0.72);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand{
    font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .06em;
    color: var(--parchment);
  }
  .brand span{ color: var(--gold); margin-right: .4rem; }

  .nav-links{ display:flex; gap: clamp(1.25rem, 3vw, 2.5rem); }
  .nav-links a{
    font-size: 1.02rem; color: var(--silver);
    padding-bottom: .2rem; border-bottom: 1px solid transparent;
    transition: color .25s ease, border-color .25s ease;
  }
  .nav-links a:hover{ color: var(--gold-bright); border-color: var(--gold); }

  .nav-toggle{ display:none; width: 34px; height: 26px; position:relative; }
  .nav-toggle span{
    position:absolute; left:0; right:0; height:2px; background: var(--parchment);
    transition: transform .3s ease, opacity .3s ease;
  }
  .nav-toggle span:nth-child(1){ top:0; }
  .nav-toggle span:nth-child(2){ top:12px; }
  .nav-toggle span:nth-child(3){ top:24px; }
  .nav.is-open .nav-toggle span:nth-child(1){ transform: translateY(12px) rotate(45deg); }
  .nav.is-open .nav-toggle span:nth-child(2){ opacity:0; }
  .nav.is-open .nav-toggle span:nth-child(3){ transform: translateY(-12px) rotate(-45deg); }

  /* ---------- Hero ---------- */
  .hero{
    position: relative;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center; overflow:hidden;
    padding: 7rem 1.5rem 4rem;
    background:
      radial-gradient(ellipse 60% 45% at 50% 18%, rgba(180,146,79,0.12), transparent 60%),
      radial-gradient(ellipse 80% 55% at 50% 105%, rgba(18,48,46,0.65), transparent 70%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  }
  .hero-stars{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .star{
    position:absolute; border-radius:50%; background: var(--parchment);
    animation: twinkle var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle{ 0%,100%{ opacity:.12; } 50%{ opacity:1; } }

  .hero-inner{ position: relative; z-index: 2; max-width: 640px; }
  .sigil-mark{
    width: 108px; height:108px; margin: 0 auto 1.75rem; color: var(--gold);
    animation: turn 140s linear infinite;
  }
  @keyframes turn{ to{ transform: rotate(360deg); } }

  .hero h1{
    font-size: clamp(2.75rem, 2.1rem + 4vw, 5.25rem);
    text-shadow: 0 0 40px rgba(180,146,79,0.25);
  }
  .hero .tagline{
    margin-top: .9rem; font-style: italic; color: var(--silver-dim);
    font-size: clamp(1.05rem, 1vw + .9rem, 1.35rem); letter-spacing: .01em;
  }
  .hero .divider-svg{ margin-top: 2.5rem; }

  /* ---------- Section spacing ---------- */
  section{ padding: clamp(4rem, 8vw, 7rem) 0; }
  .ornament{ padding: 1.5rem 0; }

  /* ---------- Dwelling ---------- */
  .dwelling-grid{
    display:grid; grid-template-columns: 0.8fr 1.2fr; gap: clamp(2rem, 5vw, 4.5rem);
    align-items:center;
  }
  .leaf-art{ color: var(--gold); opacity: .85; justify-self:center; width: min(220px, 100%); }
  .dwelling-text p{ max-width: 58ch; }
  .dwelling-text p + p{ margin-top: 1.1rem; }
  .dwelling-text h2{ margin-bottom: 1.25rem; }

  /* ---------- Chronicles ---------- */
  .chronicles h2{ margin-bottom: 2.5rem; }
  .chronicle-list li{
    display:flex; gap: clamp(1.5rem, 4vw, 3rem);
    padding: 2rem 0; border-bottom: 1px solid var(--line);
  }
  .chronicle-list li:last-child{ border-bottom:none; }
  .chronicle-season{
    flex: 0 0 150px; font-style: italic; color: var(--gold); font-size: 1.05rem;
    padding-top: .2rem;
  }
  .chronicle-body h3{ margin-bottom:.5rem; }
  .chronicle-body p{ color: var(--silver-dim); max-width: 56ch; }

  /* ---------- Grove ---------- */
  .grove h2{ margin-bottom: 2.5rem; }
  .grove-grid{ display:grid; grid-template-columns: repeat(6, 1fr); gap: 1.5rem; }
  .grove-item{
    grid-column: span 2;
    background: var(--ink-2); border-top: 2px solid var(--gold);
    padding: 1.9rem 1.6rem 2.1rem;
    transition: transform .3s ease, background .3s ease;
  }
  .grove-item:hover{ transform: translateY(-4px); background: var(--ink-3); }
  .grove-grid .grove-item:nth-child(1),
  .grove-grid .grove-item:nth-child(2){ grid-column: span 3; }
  .grove-item .icon{ margin-bottom: 1.1rem; }
  .grove-item h3{ margin-bottom: .4rem; }
  .grove-item p{ color: var(--silver-dim); font-size: 1.02rem; }

  /* ---------- Raven / contact ---------- */
  .raven{ text-align:center; }
  .raven h2{ margin-bottom: 1rem; }
  .raven > p{ max-width: 52ch; margin: 0 auto 2.25rem; color: var(--silver-dim); }
  .raven-link{
    display:inline-block; font-family: var(--font-display); font-size: 1.05rem;
    letter-spacing: .04em; color: var(--parchment);
    border: 1px solid var(--gold); padding: .95rem 2.1rem;
    transition: background .25s ease, color .25s ease;
  }
  .raven-link:hover{ background: var(--gold); color: var(--ink); }

  .socials{
    margin-top: 2.25rem; display:flex; justify-content:center; align-items:center;
    gap: 1rem; flex-wrap: wrap; color: var(--silver-dim);
  }
  .socials a{ color: var(--silver); transition: color .25s ease; }
  .socials a:hover{ color: var(--gold-bright); }
  .socials .hedera{ color: var(--gold); opacity:.7; }

  /* ---------- Footer ---------- */
  footer{
    padding: 3rem 1.5rem 3.5rem; text-align:center;
    border-top: 1px solid var(--line);
  }
  .footer-mark{ width: 40px; height:40px; margin: 0 auto 1rem; color: var(--gold); opacity:.8; }
  footer p{ color: var(--silver-dim); font-size: .98rem; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px){
    .dwelling-grid{ grid-template-columns: 1fr; text-align:center; }
    .dwelling-text p{ margin-left:auto; margin-right:auto; }
    .leaf-art{ width: 160px; }
  }

  @media (max-width: 720px){
    .nav-toggle{ display:block; }
    .nav-links{
      position: fixed; inset: 0; z-index: 90;
      flex-direction:column; align-items:center; justify-content:center;
      gap: 2.25rem; background: rgba(11,23,18,0.97);
      opacity:0; visibility:hidden; transform: translateY(-8px);
      transition: opacity .25s ease, transform .25s ease, visibility .25s;
    }
    .nav-links a{ font-size: 1.3rem; }
    .nav.is-open .nav-links{ opacity:1; visibility:visible; transform:none; }

    .chronicle-list li{ flex-direction:column; gap: .5rem; }
    .chronicle-season{ flex-basis:auto; }

    .grove-grid{ grid-template-columns: 1fr; }
    .grove-grid .grove-item,
    .grove-grid .grove-item:nth-child(1),
    .grove-grid .grove-item:nth-child(2){ grid-column: span 1; }
  }
</style>
</head>

<script>
  (function(){
    "use strict";

    // Footer year
    var yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    // Mobile nav toggle
    var nav = document.getElementById('siteNav');
    var toggle = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');

    if (toggle && nav && links){
      toggle.addEventListener('click', function(){
        var isOpen = nav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
      links.querySelectorAll('a').forEach(function(a){
        a.addEventListener('click', function(){
          nav.classList.remove('is-open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
    }

    // Twinkling hero stars — skipped for reduced-motion users
    var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var container = document.getElementById('heroStars');
    if (container){
      var count = prefersReduced ? 0 : 70;
      for (var i = 0; i < count; i++){
        var s = document.createElement('span');
        s.className = 'star';
        var size = (Math.random() * 1.8 + 0.6).toFixed(2);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = (Math.random() * 100).toFixed(2) + '%';
        s.style.top = (Math.random() * 100).toFixed(2) + '%';
        s.style.setProperty('--dur', (Math.random() * 3 + 2.5).toFixed(2) + 's');
        s.style.setProperty('--delay', (Math.random() * 4).toFixed(2) + 's');
        container.appendChild(s);
      }
    }
  })();
</script>

</body>
</html>
